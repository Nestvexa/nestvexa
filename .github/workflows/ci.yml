name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  foundation:
    strategy:
      # Report every platform even when one fails.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm test
      - run: pnpm test:coverage
      - run: pnpm size:check
      - run: pnpm test:e2e
      - run: pnpm test:pack
      - run: pnpm docs:build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-${{ matrix.os }}-${{ matrix.node }}
          path: artifacts/
  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so TruffleHog can scan every pushed commit.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Working-tree scan (tracked plus unignored files) and the license
      # allowlist over the shipped production closure.
      - run: pnpm secrets:scan
      - run: pnpm audit:licenses
      # Commit-history scan; pinned to the commit of the v3.99.8 tag.
      - uses: trufflesecurity/trufflehog@ea68ca03c865c5f324e86e849ced20ed3cf9dbbb # v3.99.8
        with:
          extra_args: --results=verified,unknown
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: supply-chain-reports
          path: artifacts/reports/
  docker:
    # Builds the documented showcase image (docs/deployment/docker.md#ci) from
    # the repository root exactly as `docker compose build` does, and checks
    # that the Compose file resolves. Nothing is pushed or started.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f examples/showcase/docker-compose.yml config --quiet
      - run: >-
          docker build
          --file examples/showcase/Dockerfile
          --tag nestvexa-showcase:ci
          .
      # The image runs as the unprivileged `node` user and declares the health check.
      - run: |
          test "$(docker image inspect --format '{{.Config.User}}' nestvexa-showcase:ci)" = node
          docker image inspect --format '{{json .Config.Healthcheck}}' nestvexa-showcase:ci | grep -q '/api/health'

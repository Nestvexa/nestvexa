name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  foundation:
    strategy:
      # Report every platform even when one fails.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: 10.26.1
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm lint
      # Public API reports (api-reports/, docs/contributing/api-reports.md).
      - run: pnpm api:check
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      # One leg runs every Vitest suite under the project-wide coverage gate
      # (against packages/*/src); the other three run the same suites against
      # the built dist output. See docs/testing/coverage.md.
      - if: ${{ !(matrix.os == 'ubuntu-latest' && matrix.node == 24) }}
        run: pnpm test
      - if: ${{ matrix.os == 'ubuntu-latest' && matrix.node == 24 }}
        run: pnpm test:coverage
      - run: pnpm size:check
      - run: pnpm test:e2e
      # Flakes (passed only on a retry) are listed as warnings and in the job
      # summary here; nightly and release runs fail on them
      # (docs/testing/flaky-tests.md).
      - name: Flaky browser tests (report)
        if: ${{ !cancelled() }}
        run: node scripts/flaky-check.mjs --mode=report
      - run: pnpm test:pack
      - run: pnpm docs:build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-${{ matrix.os }}-${{ matrix.node }}
          path: artifacts/
  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so TruffleHog can scan every pushed commit.
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 10.26.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Working-tree scan (tracked plus unignored files) and the license
      # allowlist over the shipped production closure.
      - run: pnpm secrets:scan
      - run: pnpm audit:licenses
      # Commit-history scan; pinned to the commit of the v3.99.8 tag.
      - uses: trufflesecurity/trufflehog@ea68ca03c865c5f324e86e849ced20ed3cf9dbbb # v3.99.8
        with:
          extra_args: --results=verified,unknown
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: supply-chain-reports
          path: artifacts/reports/
  docker:
    # Builds the documented showcase image (docs/deployment/docker.md#ci) from
    # the repository root exactly as `docker compose build` does, and checks
    # that the Compose file resolves. Nothing is pushed or started.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f examples/showcase/docker-compose.yml config --quiet
      - run: >-
          docker build
          --file examples/showcase/Dockerfile
          --tag nestvexa-showcase:ci
          .
      # The image runs as the unprivileged `node` user and declares the health check.
      - run: |
          test "$(docker image inspect --format '{{.Config.User}}' nestvexa-showcase:ci)" = node
          docker image inspect --format '{{json .Config.Healthcheck}}' nestvexa-showcase:ci | grep -q '/api/health'
  pr-policy:
    # MAINT-010: the pull-request title is a Conventional Commit, and every
    # published package whose src/ changes is named by a changeset in the PR
    # (or the PR has the `no-changeset` label). PR text reaches the script
    # only through env, never through the shell. Editing the title or labels
    # does not start a new run: re-run this job afterwards.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          # The merge base with the target branch must be reachable.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/pr-check.mjs
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
  ledger:
    # LEDGER-025: the feature ledger's coverage and Done-evidence checks
    # (missing files, stubs, skipped tests, unfinished-work markers) and the
    # checker's own self-test. Node built-ins only, so no install.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/ledger.mjs --self-test
      - run: node scripts/ledger.mjs check
